<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>DevStyle</title>

    <link
        rel="stylesheet"
        href="popup.css"
    >

</head>

<body>

    <div class="popup">

        <div class="brand">

            <div class="brand-icon">
                ✦
            </div>

            <div>

                <h2>
                    DevStyle
                </h2>

                <p>
                    Visual CSS Editor
                </p>

            </div>

        </div>


        <button id="inspectBtn">

            <span>
                Inspect Element
            </span>

            <span class="shortcut">
                Ctrl + Shift + E
            </span>

        </button>


        <div class="popup-divider"></div>


        <div class="shortcut-info">

            <span>
                ⌨️
            </span>

            <div>

                <strong>
                    Quick Inspect
                </strong>

                <p>
                    Use Ctrl + Shift + E
                    anytime on a webpage.
                </p>

            </div>

        </div>

    </div>


    <script src="popup.js"></script>

</body>

</html>
