<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>DevStyle</title>

    <link
        rel="stylesheet"
        href="popup.css"
    >

</head>


<body>

    <div class="popup">


        <!-- =========================
             BRAND
        ========================== -->

        <div class="brand">

            <div class="brand-icon">
                ✦
            </div>

            <div>

                <h2>
                    DevStyle
                    <span class="version">
                        V2.0
                    </span>
                </h2>

                <p>
                    Visual CSS Editor
                </p>

            </div>

        </div>


        <!-- =========================
             INSPECT BUTTON
        ========================== -->

        <button id="inspectBtn">

            <span>
                Inspect Element
            </span>

            <span class="shortcut">
                Ctrl + Shift + E
            </span>

        </button>


        <div class="popup-divider"></div>


        <!-- =========================
             SHORTCUTS
        ========================== -->

        <div class="section-title">
            Handy Shortcuts
        </div>


        <div class="shortcut-list">


            <!-- Move -->

            <div class="shortcut-row">

                <div class="shortcut-info">

                    <div class="shortcut-icon">
                        ↔
                    </div>

                    <div>

                        <strong>
                            Move Element
                        </strong>

                        <span>
                            Drag the selected element
                        </span>

                    </div>

                </div>

                <kbd>
                    M
                </kbd>

            </div>


            <!-- Select -->

            <div class="shortcut-row">

                <div class="shortcut-info">

                    <div class="shortcut-icon">
                        ⌖
                    </div>

                    <div>

                        <strong>
                            Select Element
                        </strong>

                        <span>
                            Choose another element
                        </span>

                    </div>

                </div>

                <kbd>
                    H
                </kbd>

            </div>


            <!-- Escape -->

            <div class="shortcut-row">

                <div class="shortcut-info">

                    <div class="shortcut-icon">
                        ×
                    </div>

                    <div>

                        <strong>
                            Cancel Mode
                        </strong>

                        <span>
                            Stop move or inspect mode
                        </span>

                    </div>

                </div>

                <kbd>
                    Esc
                </kbd>

            </div>


            <!-- Main shortcut -->

            <div class="shortcut-row">

                <div class="shortcut-info">

                    <div class="shortcut-icon">
                        ⚡
                    </div>

                    <div>

                        <strong>
                            Quick Inspect
                        </strong>

                        <span>
                            Start DevStyle anywhere
                        </span>

                    </div>

                </div>


                <div class="key-group">

                    <kbd>
                        Ctrl
                    </kbd>

                    <span>
                        +
                    </span>

                    <kbd>
                        Shift
                    </kbd>

                    <span>
                        +
                    </span>

                    <kbd>
                        E
                    </kbd>

                </div>

            </div>

        </div>


        <!-- =========================
             DEVELOPER FOOTER
        ========================== -->

        <div class="developer-footer">

            <a
                href="https://github.com/Yashraj-sunilyadav/devstyle"
                target="_blank"
                rel="noopener noreferrer"
            >
                Developed by Yazz
            </a>

        </div>


    </div>


    <script src="popup.js"></script>

</body>

</html>
